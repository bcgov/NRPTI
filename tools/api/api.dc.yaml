kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: ${NAME}-api
  labels:
    template: ${NAME}-api
    app: ${GROUP_NAME}
objects:
  - kind: Secret
    apiVersion: v1
    metadata:
      name: ${NAME}-mongodb
    stringData:
      MONGODB_ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD}
      MONGODB_DATABASE: ${DATABASE_NAME}
      MONGODB_PASSWORD: ${DATABASE_PASSWORD}
      MONGODB_USERNAME: ${DATABASE_USER}
    type: Opaque
  - kind: Service
    apiVersion: v1
    metadata:
      name: ${NAME}-api
      labels:
        app: ${GROUP_NAME}
    spec:
      ports:
        - name: web
          port: 3000
          targetPort: 3000
      selector:
        name: ${NAME}-api
  - kind: Route
    apiVersion: v1
    metadata:
      name: ${NAME}-api
      labels:
        app: ${GROUP_NAME}
    spec:
      host: ${NAME}-api-${APPLICATION_DOMAIN}
      to:
        kind: Service
        name: ${NAME}-api
      path: ${APPLICATION_DOMAIN_PATH}
      port:
        targetPort: web
      tls:
        termination: edge
      wildcardPolicy: None
  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      labels:
        app: nrpti
        app.kubernetes.io/part-of: backend
        app.openshift.io/runtime: nodejs
        role: api
      name: nrpti-api
      namespace: f00029-${ENVIRONMENT}
      annotations:
        image.openshift.io/triggers: '[{"from": {"kind": "ImageStreamTag", "name":
          "nrpti-api:latest", "namespace": "f00029-tools"}, "fieldPath":
          "spec.template.spec.containers[?(@.name==\"nrpti-api\")].image", "paused":
          false}]'
    spec:
      replicas: 1
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          name: nrpti-api
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 25%
          maxUnavailable: 25%
      template:
        metadata:
          creationTimestamp: null
          labels:
            app: nrpti
            name: nrpti-api
            role: api
          name: nrpti-api
        spec:
          containers:
            - env:
                - name: MONGODB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: MONGODB_USERNAME
                      name: ${NAME}-mongodb
                - name: MONGODB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: MONGODB_PASSWORD
                      name: ${NAME}-mongodb
                - name: MONGODB_DATABASE
                  valueFrom:
                    secretKeyRef:
                      key: MONGODB_DATABASE
                      name: ${NAME}-mongodb
                # API envs
                - name: API_HOSTNAME
                  value: ${APPLICATION_DOMAIN}
                - name: API_LOCATION
                  value: https://${NAME}-api-${APPLICATION_DOMAIN}
                - name: API_PATH
                  value: ${API_PATH}
                - name: API_PUBLIC_PATH
                  value: ${API_PUBLIC_PATH}
                - name: ENVIRONMENT
                  value: ${ENVIRONMENT}
                # External resource envs
                - name: GEOCODER_API
                  value: ${GEOCODER_API}
                - name: PARALLEL_IMPORT_LIMIT
                  value: ${PARALLEL_IMPORT_LIMIT}
                - name: NRIS_TOKEN_ENDPOINT
                  value: ${NRIS_TOKEN_ENDPOINT}
                - name: NRIS_EPD_API_ENDPOINT
                  value: ${NRIS_EPD_API_ENDPOINT}
                - name: EPIC_API_HOSTNAME
                  value: ${EPIC_API_HOSTNAME}
                # Keycloak envs
                - name: SSO_JWKSURI
                  value: ${SSO_JWKSURI}
                - name: SSO_ISSUER
                  value: ${SSO_ISSUER}
                - name: KEYCLOAK_CLIENT_ID
                  value: ${KEYCLOAK_CLIENT_ID}
                - name: KEYCLOAK_URL
                  value: ${KEYCLOAK_URL}
                - name: KEYCLOAK_REALM
                  value: ${KEYCLOAK_REALM}
                - name: KEYCLOAK_ENABLED
                  value: 'true'
                # Toggle to enable NRIS-EMLI importer
                - name: NRIS_EMLI_DOCUMENT_BINARIES_ENABLED
                  value: 'true'
                - name: NRIS_EMLI_API_ENDPOINT
                  value: 'https://api.nrs.gov.bc.ca/nrisws-api/v1/emprInspections'
                - name: NODE_OPTIONS
                  value: --max-old-space-size=9216
              envFrom:
                - prefix: NRIS_
                  secretRef:
                    name: nrisws-credentials
                - prefix: OBJECT_STORE_
                  secretRef:
                    name: nr-object-store-credential
                - prefix: CORE_
                  secretRef:
                    name: core-api
              image: image-registry.openshift-image-registry.svc:5000/f00029-tools/nrpti-api@sha256:e5d62c575a333e7b066d4894bada95fcdf1c731bcc934c080d5bf6010edeb541
              imagePullPolicy: Always
              livenessProbe:
                failureThreshold: 3
                httpGet:
                  path: ${READINESS_PROBE_URL}
                  port: 3000
                  scheme: HTTP
                initialDelaySeconds: 30
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 3000
              name: nrpti-api
              ports:
                - containerPort: 3000
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: ${READINESS_PROBE_URL}
                  port: 3000
                  scheme: HTTP
                initialDelaySeconds: 3
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 3000
              resources:
                limits:
                  cpu: ${API_CPU_LIMITS}
                  memory: ${API_MEMORY_LIMITS}
                requests:
                  cpu: ${API_CPU_REQUESTS}
                  memory: ${API_MEMORY_REQUESTS}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
  - kind: PersistentVolumeClaim
    apiVersion: v1
    metadata:
      name: ${NAME}-mongodb-data
      labels:
        app: ${GROUP_NAME}
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: ${DATABASE_VOLUME_CAPACITY}
  - kind: Service
    apiVersion: v1
    metadata:
      name: mongodb
      labels:
        app: ${GROUP_NAME}
    spec:
      ports:
        - name: mongodb-${NAME}
          port: 27017
          targetPort: 27017
      selector:
        name: ${NAME}-mongodb
  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      labels:
        app: ${GROUP_NAME}
        app.kubernetes.io/part-of: backend
        app.openshift.io/runtime: mongodb
        role: database
      name: ${NAME}-mongodb
      namespace: f00029-dev
      annotations:
        image.openshift.io/triggers: '[{"from": {"kind": "ImageStreamTag", "name":
          "mongodb:5.0.32", "namespace": "f00029-tools"}, "fieldPath":
          "spec.template.spec.containers[?(@.name==\"nrpti-mongodb\")].image",
          "paused": false}]'
    spec:
      replicas: 1
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          name: ${NAME}-mongodb
      strategy:
        type: Recreate
      template:
        metadata:
          creationTimestamp: null
          labels:
            app: ${GROUP_NAME}
            name: ${NAME}-mongodb
            role: database
          name: ${NAME}-mongodb
        spec:
          containers:
            - args:
                - --dbpath=/var/lib/mongodb/data
                - --bind_ip_all
              command:
                - mongod
              env:
                - name: MONGODB_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-mongodb
                      key: MONGODB_USERNAME
                - name: MONGODB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-mongodb
                      key: MONGODB_PASSWORD
                - name: MONGODB_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-mongodb
                      key: MONGODB_DATABASE
                - name: MONGODB_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-mongodb
                      key: MONGODB_ADMIN_PASSWORD
              image: docker.io/library/mongo@sha256:b2ace5ddbeb6d2e035aab54c486b8145bef83cff7bc3d518598b8449db74f3aa
              imagePullPolicy: IfNotPresent
              livenessProbe:
                failureThreshold: 3
                initialDelaySeconds: 30
                periodSeconds: 10
                successThreshold: 1
                tcpSocket:
                  port: 27017
                timeoutSeconds: 5
              name: nrpti-mongodb
              ports:
                - containerPort: 27017
                  protocol: TCP
              readinessProbe:
                exec:
                  command:
                    - /bin/sh
                    - -i
                    - -c
                    - mongo 127.0.0.1:27017/$MONGODB_DATABASE -u $MONGODB_USER -p
                      $MONGODB_PASSWORD --eval='quit()'
                failureThreshold: 3
                initialDelaySeconds: 3
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 5
              resources:
                limits:
                  cpu: ${DATABASE_CPU_LIMITS}
                  memory: ${DATABASE_MEMORY_LIMITS}
                requests:
                  cpu: ${DATABASE_CPU_REQUESTS}
                  memory: ${DATABASE_MEMORY_REQUESTS}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - mountPath: /var/lib/mongodb/data
                  name: ${NAME}-mongodb-data
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
          volumes:
            - name: ${NAME}-mongodb-data
              persistentVolumeClaim:
                claimName: ${NAME}-mongodb-data
parameters:
  - name: NAME
    displayName: Name
    description: The name assigned to all of the frontend objects defined in this template.
    required: true
    value: nrpti
  - name: GROUP_NAME
    displayName: Group Name
    description: The name assigned to a group of objects deployed together
    required: true
    value: nrpti
  - name: MONGO_IMAGE_NAMESPACE
    displayName: mongo image namespace
    description: The OpenShift Namespace where the mongo ImageStream resides.
    value: openshift
  - name: MONGO_VER
    displayName: Mongo Version Number
    description:
      The version number of Mongo that matches the version in project file
      package.json
    value: '3.6'
  - name: API_CPU_LIMITS
    value: '1'
  - name: API_MEMORY_LIMITS
    value: 1Gi
  - name: API_CPU_REQUESTS
    value: 150m
  - name: API_MEMORY_REQUESTS
    value: 250Mi
  - name: DATABASE_CPU_LIMITS
    value: '1'
  - name: DATABASE_MEMORY_LIMITS
    value: 2Gi
  - name: DATABASE_CPU_REQUESTS
    value: 150m
  - name: DATABASE_MEMORY_REQUESTS
    value: 1Gi
  - name: APPLICATION_DOMAIN
    displayName: Application Hostname
    description:
      The exposed hostname that will route to the Node.js service, if left
      blank a value will be defaulted.
    value: f00029-dev.apps.silver.devops.gov.bc.ca
  - name: API_PATH
    displayName: Root level api path
    value: /api
  - name: GEOCODER_API
    displayName: Geocoder API URL
    value: https://geocoder.api.gov.bc.ca
    required: true
  - name: API_PUBLIC_PATH
    displayName: Path to the public section of the api
    value: /api/public
  - name: KEYCLOAK_CLIENT_ID
    displayName: The keycloak client id for admin
    value: nrpti-4869
  - name: KEYCLOAK_URL
    value: https://dev.oidc.gov.bc.ca/auth
  - name: KEYCLOAK_REALM
    value: 3l5nw6dk
  - name: ENVIRONMENT
    displayName: Name of this environment
    value: dev
  - name: APPLICATION_DOMAIN_PATH
    displayName: Application Hostname Path
    description: The path for this service.
    value: /api
  - name: DATABASE_USER
    displayName: MongoDB Username
    description: Username for MongoDB user that will be used for accessing the database.
    generate: expression
    from: "user[A-Z0-9]{3}"
  - name: DATABASE_PASSWORD
    displayName: MongoDB Password
    description: Password for the MongoDB user.
    generate: expression
    from: "[a-zA-Z0-9]{16}"
  - name: DATABASE_NAME
    displayName: Database Name
    value: nrpti
  - name: DATABASE_ADMIN_PASSWORD
    displayName: Database Administrator Password
    description: Password for the database admin user.
    generate: expression
    from: "[a-zA-Z0-9]{16}"
  - name: PORT
    displayName: Application port
    description: Port that application is listening on for requests.
    value: '3000'
    required: true
  - name: DATABASE_VOLUME_CAPACITY
    displayName: Database Volume Capacity
    description: Volume space available for mongo database, e.g. 512Mi, 2Gi.
    value: 10Gi
    required: true
  - name: APP_IMAGE_NAME
    displayName: Application image name.
    description: Application image name.
    value: nrpti-api
    required: true
  - name: APP_IMAGE_NAMESPACE
    displayName: Namespace containing application images.
    description: Namespace containing application images.
    value: f00029-tools
    required: true
  - name: APP_DEPLOYMENT_TAG
    displayName: Image tag to watch for changes and trigger deployment.
    description: Image tag to watch for changes and trigger deployment.
    value: latest
    required: true
  - name: READINESS_PROBE_URL
    displayName: URL to watch for readiness.
    description: URL to watch for readiness.
    value: /api/docs
    required: true
  - name: PARALLEL_IMPORT_LIMIT
    displayName: Maximum number of parallel import jobs to run
    description: Maximum number of parallel import jobs to run
    required: false
  - name: SSO_JWKSURI
    displayName: Uri to sso certs
    description: Uri to sso certs
    value: https://dev.oidc.gov.bc.ca/auth/realms/3l5nw6dk/protocol/openid-connect/certs
    required: false
  - name: SSO_ISSUER
    displayName: URI to SSO realm
    description: URI to SSO realm
    value: https://dev.oidc.gov.bc.ca/auth/realms/3l5nw6dk
    required: false
  - name: NRIS_TOKEN_ENDPOINT
    value: https://api.nrs.gov.bc.ca/oauth2/v1/oauth/token?disableDeveloperFilter=true&grant_type=client_credentials&scope=NRISWS.*
  - name: NRIS_EPD_API_ENDPOINT
    value: https://api.nrs.gov.bc.ca/nrisws-api/v1/epdInspections
  - name: EPIC_API_HOSTNAME
    value: projects.eao.gov.bc.ca
